server:
  port: 8085
  error:
    include-message: always
    include-binding-errors: always
spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/notification_db
    username: ${DB_USER:bfsi}
    password: ${DB_PASSWORD:bfsi123}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
internal:
  secret: ${INTERNAL_SECRET:change-me-internal-secret}



