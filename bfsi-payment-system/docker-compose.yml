# Full stack: PostgreSQL + Eureka + Gateway + 5 microservices + React frontend.
#   docker compose up -d --build        # everything
#   docker compose up -d postgres       # database only (run the services from your IDE / ./start-all.sh)

x-service-env: &service-env
  DB_HOST: postgres
  DB_USER: bfsi
  DB_PASSWORD: ${DB_PASSWORD:-bfsi123}
  EUREKA_URL: http://discovery-server:8761/eureka
  INTERNAL_SECRET: ${INTERNAL_SECRET:-change-me-internal-secret}

x-java-service: &java-service
  restart: unless-stopped
  networks: [bfsi-net]
  depends_on:
    postgres:
      condition: service_healthy
    discovery-server:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: bfsi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bfsi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bfsi123}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # runs only on first start of an empty volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfsi -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [bfsi-net]

  discovery-server:
    build: { context: ., args: { SERVICE: discovery-server } }
    image: bfsi/discovery-server:1.0.0
    container_name: bfsi-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [bfsi-net]

  api-gateway:
    <<: *java-service
    build: { context: ., args: { SERVICE: api-gateway } }
    image: bfsi/api-gateway:1.0.0
    container_name: bfsi-gateway
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-bfsi-demo-secret-key-change-in-production-32b!}
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - "8080:8080"

  auth-service:
    <<: *java-service
    build: { context: ., args: { SERVICE: auth-service } }
    image: bfsi/auth-service:1.0.0
    container_name: bfsi-auth
    environment:
      <<: *service-env
      JWT_SECRET: ${JWT_SECRET:-bfsi-demo-secret-key-change-in-production-32b!}

  customer-service:
    <<: *java-service
    build: { context: ., args: { SERVICE: customer-service } }
    image: bfsi/customer-service:1.0.0
    container_name: bfsi-customer
    environment:
      <<: *service-env

  ledger-service:
    <<: *java-service
    build: { context: ., args: { SERVICE: ledger-service } }
    image: bfsi/ledger-service:1.0.0
    container_name: bfsi-ledger
    environment:
      <<: *service-env

  notification-service:
    <<: *java-service
    build: { context: ., args: { SERVICE: notification-service } }
    image: bfsi/notification-service:1.0.0
    container_name: bfsi-notification
    environment:
      <<: *service-env

  payment-service:
    <<: *java-service
    build: { context: ., args: { SERVICE: payment-service } }
    image: bfsi/payment-service:1.0.0
    container_name: bfsi-payment
    environment:
      <<: *service-env

  kafka:
    image: apache/kafka:3.7.0
    container_name: bfsi-kafka
    ports: [ "29092:29092" ]          # for services you run on your own machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [ bfsi-net ]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    image: bfsi/frontend:1.0.0
    container_name: bfsi-frontend
    restart: unless-stopped
    depends_on: [api-gateway]
    ports:
      - "5173:80"     # same host port as `npm run dev`, which the gateway's CORS config allows
    networks: [bfsi-net]

networks:
  bfsi-net:

volumes:
  pgdata:
